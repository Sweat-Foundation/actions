name: Release

on:
  workflow_call:
    inputs:
      files:
        description: Newline-separated list of file paths/globs to attach to the release.
        required: true
        type: string
      tag:
        description: Tag to release. Defaults to the ref that triggered the calling workflow.
        required: false
        type: string
        default: ${{ github.ref_name }}
      title:
        description: Release title. Defaults to the tag name.
        required: false
        type: string
        default: ''
      generate-notes:
        description: Auto-generate release notes from merged PRs since the previous tag.
        required: false
        type: boolean
        default: true
      dao-account-id:
        description: NEAR account ID of the DAO contract to store the release binary's blob on. Leave empty to skip this step.
        required: false
        type: string
        default: ''
      proposer-account-id:
        description: NEAR account ID that signs and pays for the store_blob call.
        required: false
        type: string
        default: ''
      blob-path:
        description: Path to the file to store as a blob on the DAO contract (e.g. the release wasm). Required when dao-account-id is set.
        required: false
        type: string
        default: ''
      network:
        description: NEAR network to submit the store_blob transaction to.
        required: false
        type: string
        default: mainnet
      prepaid-gas:
        description: Gas attached to the store_blob call.
        required: false
        type: string
        default: '300 TGas'
      attached-deposit:
        description: >
          Deposit attached to the store_blob call, e.g. "5 NEAR" or "500 yoctonear". Leave empty to
          auto-calculate the exact minimum from NEAR's storage staking price (1e19 yoctoNEAR/byte,
          https://docs.near.org/protocol/storage/storage-staking) for the file at blob-path, plus
          sputnik-dao-contract's 32-byte bookkeeping overhead per stored blob (see store_blob in
          near-daos/sputnik-dao-contract). Set explicitly if the target DAO contract charges
          differently.
        required: false
        type: string
        default: ''
      contract-name:
        description: Human-readable contract/project name for the Slack notification. Leave empty to skip Slack notification entirely.
        required: false
        type: string
        default: ''
      wasm-path:
        description: Path to the wasm (or other artifact) to hash for the Slack notification. Required when contract-name is set.
        required: false
        type: string
        default: ''
      remove-blob-url:
        description: >
          URL of the calling repo's remove-blob workflow run page, linked from the Slack message
          alongside the blob's hash when dao-account-id is set. Defaults to
          https://github.com/<repo>/actions/workflows/remove-blob.yml — override if your wrapper
          workflow file isn't named remove-blob.yml.
        required: false
        type: string
        default: ''
    secrets:
      proposer-private-key:
        description: NEAR private key (e.g. ed25519:...) for proposer-account-id, used to sign the store_blob call. Required when dao-account-id is set.
        required: false
      slack-webhook-url:
        description: Slack incoming webhook URL to post the release notification to. Required when contract-name is set.
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.title != '' && inputs.title || inputs.tag }}
          generate_release_notes: ${{ inputs.generate-notes }}
          files: ${{ inputs.files }}

  store-blob:
    needs: release
    if: inputs.dao-account-id != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install near-cli-rs
        env:
          VERSION: 0.29.0
          SHA256: e63eb0610972c5e2f9fc451056fa0187201c19b8aa49e72143de70c57d043d09
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o near-cli.tar.gz \
            "https://github.com/near/near-cli-rs/releases/download/v${VERSION}/near-cli-rs-x86_64-unknown-linux-gnu.tar.gz"
          echo "${SHA256}  near-cli.tar.gz" | sha256sum -c -
          tar -xzf near-cli.tar.gz
          install -m 755 near-cli-rs-x86_64-unknown-linux-gnu/near "$HOME/.cargo/bin/near"
          near --version

      - name: Store blob on DAO
        env:
          DAO_ACCOUNT_ID: ${{ inputs.dao-account-id }}
          PROPOSER_ACCOUNT_ID: ${{ inputs.proposer-account-id }}
          BLOB_PATH: ${{ inputs.blob-path }}
          NETWORK: ${{ inputs.network }}
          PREPAID_GAS: ${{ inputs.prepaid-gas }}
          ATTACHED_DEPOSIT: ${{ inputs.attached-deposit }}
          PROPOSER_PRIVATE_KEY: ${{ secrets.proposer-private-key }}
        run: |
          set -euo pipefail

          deposit="$ATTACHED_DEPOSIT"
          if [[ -z "$deposit" ]]; then
            blob_bytes=$(stat -c%s "$BLOB_PATH")
            # NEAR storage staking price: 1e19 yoctoNEAR per byte
            # (https://docs.near.org/protocol/storage/storage-staking). store_blob additionally
            # charges 32 bytes for the blobs map's CryptoHash key it writes alongside the raw
            # blob (near-daos/sputnik-dao-contract, sputnikdao2/src/lib.rs `store_blob`).
            deposit_yocto=$(python3 -c "print(($blob_bytes + 32) * 10_000_000_000_000_000_000)")
            deposit="${deposit_yocto} yoctonear"
          fi

          near contract call-function as-transaction "$DAO_ACCOUNT_ID" store_blob \
            file-args "$BLOB_PATH" \
            prepaid-gas "$PREPAID_GAS" \
            attached-deposit "$deposit" \
            sign-as "$PROPOSER_ACCOUNT_ID" \
            network-config "$NETWORK" \
            sign-with-plaintext-private-key "$PROPOSER_PRIVATE_KEY" \
            send

  notify-slack:
    needs: [release, store-blob]
    if: always() && inputs.contract-name != '' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Notify Slack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
          CONTRACT_NAME: ${{ inputs.contract-name }}
          TAG: ${{ inputs.tag }}
          WASM_PATH: ${{ inputs.wasm-path }}
          DAO_ACCOUNT_ID: ${{ inputs.dao-account-id }}
          REMOVE_BLOB_URL: ${{ inputs.remove-blob-url }}
          STORE_BLOB_RESULT: ${{ needs.store-blob.result }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          export DESCRIPTION=$(gh release view "$TAG" --repo "$REPO" --json body -q .body)
          export REMOVE_URL="${REMOVE_BLOB_URL:-https://github.com/${REPO}/actions/workflows/remove-blob.yml}"

          # Build a Slack Block Kit payload rather than the plain `text` field: GitHub's
          # auto-generated release notes use GitHub markdown (##, **, [text](url)), which Slack's
          # mrkdwn does not understand, so the notes are parsed and re-rendered here instead of
          # passed through as-is. blob_hash is base58(sha256(file)) — what store_blob returns and
          # what remove_blob's `hash` input expects — computed independently of store-blob so it's
          # correct regardless of how store-blob computed its own deposit.
          python3 <<'PY' > payload.json
          import hashlib
          import json
          import os
          import re

          contract_name = os.environ["CONTRACT_NAME"]
          version = os.environ["TAG"].removeprefix("v")
          wasm_path = os.environ["WASM_PATH"]
          release_url = os.environ["RELEASE_URL"]
          run_url = os.environ["RUN_URL"]
          dao_account_id = os.environ["DAO_ACCOUNT_ID"]
          store_blob_result = os.environ["STORE_BLOB_RESULT"]
          remove_url = os.environ["REMOVE_URL"]
          description = os.environ["DESCRIPTION"]

          digest = hashlib.sha256(open(wasm_path, "rb").read()).digest()
          wasm_hash = digest.hex()

          alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          num = int.from_bytes(digest, "big")
          enc = ""
          while num:
              num, rem = divmod(num, 58)
              enc = alphabet[rem] + enc
          pad = len(digest) - len(digest.lstrip(b"\x00"))
          blob_hash = alphabet[0] * pad + enc

          bullets = re.findall(r"^\*\s+(.+)$", description, flags=re.MULTILINE)
          compare_match = re.search(r"Full Changelog\*\*:\s*(\S+)", description)
          compare_url = compare_match.group(1) if compare_match else None

          blocks = [{
              "type": "section",
              "text": {
                  "type": "mrkdwn",
                  "text": f"🚚 *{contract_name} {version}* is ready to deploy!\n<{release_url}|View release>",
              },
          }]

          if bullets or compare_url:
              lines = ["🗞️ *What's changed:*"]
              lines += [f"• {b}" for b in bullets[:10]]
              if compare_url:
                  lines.append(f"<{compare_url}|Full changelog>")
              blocks.append({"type": "section", "text": {"type": "mrkdwn", "text": "\n".join(lines)}})

          blocks.append({"type": "divider"})
          blocks.append({
              "type": "section",
              "text": {
                  "type": "mrkdwn",
                  "text": f"🧮 *Checksum:*\n• *SHA256:* `{wasm_hash}`\n• *Base58:* `{blob_hash}`",
              },
          })

          if dao_account_id:
              blocks.append({"type": "divider"})
              if store_blob_result == "failure":
                  # Don't report success when store-blob actually failed — surface the failure
                  # instead of silently omitting it.
                  blocks.append({
                      "type": "section",
                      "text": {"type": "mrkdwn", "text": f"⚠️ *store_blob failed* — <{run_url}|see workflow run>"},
                  })
              elif store_blob_result == "success":
                  blocks.append({
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": f"📦 *Blob hash:* `{blob_hash}`\n🗑️ <{remove_url}|Remove from DAO storage>",
                      },
                  })

          fallback = f"{contract_name} {version} is ready to deploy"
          print(json.dumps({"text": fallback, "blocks": blocks}))
          PY

          curl --fail -sS -X POST -H 'Content-Type: application/json' --data @payload.json "$SLACK_WEBHOOK_URL"
